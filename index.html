<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Columba Notebook - Verificación de Acceso</title>
  <style>
    :root {
      --primary-color: #0d6efd;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #dee2e6;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    p {
      color: #666;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    input[type="email"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #0b5ed7;
    }

    .oculto {
      display: none !important;
    }

    .status-msg {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .status-error { color: #dc3545; }
    .status-success { color: #198754; }

    /* Estilos para Tarjetas de Suscripción */
    .plans-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .plan-card {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 15px;
      background-color: #fdfdfd;
    }

    .plan-card h3 {
      margin: 0 0 10px 0;
    }

    .plan-price {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- VISTA 1: PANTALLA DE ACCESO (Por defecto para pedir email) -->
    <div id="vista-acceso" class="card">
      <h2>Columba Notebook</h2>
      <p>Ingrese su correo electrónico para verificar su acceso.</p>
      
      <form id="form-acceso" onsubmit="validarCorreo(event)">
        <div class="form-group">
          <label for="txt-email">Correo Electrónico:</label>
          <input type="email" id="txt-email" placeholder="ejemplo@correo.com" required>
        </div>
        <button type="submit" id="btn-verificar">Continuar</button>
      </form>

      <div id="mensaje-estado" class="status-msg"></div>
    </div>

    <!-- VISTA 2: OPCIONES DE SUSCRIPCIÓN / REGISTRO (Se muestra si no existe o está vencido) -->
    <div id="vista-suscripcion" class="card oculto">
      <h2>Planes de Suscripción</h2>
      <p id="subtitulo-suscripcion">Seleccione un plan para activar su acceso.</p>

      <div class="plans-container">
        <div class="plan-card">
          <h3>Suscripción Mensual</h3>
          <div class="plan-price">$10 USD / mes</div>
          <button onclick="procesarPago('plan_mensual')">Suscribirse</button>
        </div>

        <div class="plan-card">
          <h3>Suscripción Anual</h3>
          <div class="plan-price">$100 USD / año</div>
          <button onclick="procesarPago('plan_anual')">Suscribirse</button>
        </div>
      </div>

      <br>
      <button onclick="volverAAcceso()" style="background-color: #6c757d;">Volver</button>
    </div>

    <!-- VISTA 3: PANTALLA DE BIENVENIDA / ACCESO PERMITIDO -->
    <div id="vista-bienvenida" class="card oculto">
      <h2>¡Acceso Concedido!</h2>
      <p>Bienvenido de nuevo a Columba Notebook.</p>
      <div id="info-usuario" style="margin-bottom: 20px; font-weight: bold;"></div>
      <button onclick="ingresarAlSistema()">Ingresar al Sistema</button>
    </div>

  </div>

  <script>
    // URL del despliegue de Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwuaM_X7RLsBFMv8tk59x5wD8U_OpNV4iCnW6D8PCMJ6ApOYljtxDdccIzo8dzhkmyu/exec";

    async function validarCorreo(e) {
      e.preventDefault();
      
      const emailInput = document.getElementById("txt-email").value.trim();
      const msgDiv = document.getElementById("mensaje-estado");
      const btn = document.getElementById("btn-verificar");

      if (!emailInput) return;

      msgDiv.className = "status-msg";
      msgDiv.textContent = "Verificando acceso...";
      btn.disabled = true;

      try {
        const response = await fetch(`${WEB_APP_URL}?email=${encodeURIComponent(emailInput)}`);
        const data = await response.json();

        btn.disabled = false;

        switch (data.accionServidor) {
          case "permitir_acceso":
            msgDiv.textContent = "";
            mostrarVistaBienvenida(data.usuario);
            break;

          case "registrar":
            msgDiv.textContent = "";
            mostrarVistaSuscripcion("Usuario no registrado. Elija un plan para continuar.");
            break;

          case "renovar_suscripcion":
            msgDiv.textContent = "";
            mostrarVistaSuscripcion("Su suscripción se encuentra vencida. Por favor, renueve su plan.");
            break;

          case "pedir_email":
          default:
            msgDiv.className = "status-msg status-error";
            msgDiv.textContent = data.mensaje || "Por favor, ingrese un correo válido.";
            break;
        }

      } catch (err) {
        btn.disabled = false;
        msgDiv.className = "status-msg status-error";
        msgDiv.textContent = "Error de conexión con el servidor. Intente nuevamente.";
        console.error("Error al consultar Apps Script:", err);
      }
    }

    function mostrarVistaSuscripcion(mensaje) {
      document.getElementById("vista-acceso").classList.add("oculto");
      document.getElementById("vista-bienvenida").classList.add("oculto");
      
      document.getElementById("subtitulo-suscripcion").textContent = mensaje;
      document.getElementById("vista-suscripcion").classList.remove("oculto");
    }

    function mostrarVistaBienvenida(usuario) {
      document.getElementById("vista-acceso").classList.add("oculto");
      document.getElementById("vista-suscripcion").classList.add("oculto");

      document.getElementById("info-usuario").textContent = `Usuario: ${usuario.email}`;
      document.getElementById("vista-bienvenida").classList.remove("oculto");
    }

    function volverAAcceso() {
      document.getElementById("vista-suscripcion").classList.add("oculto");
      document.getElementById("vista-bienvenida").classList.add("oculto");
      document.getElementById("vista-acceso").classList.remove("oculto");
      document.getElementById("mensaje-estado").textContent = "";
    }

    function procesarPago(planId) {
      alert(`Redirigiendo a la pasarela de pago para el plan: ${planId}`);
      // Aquí puedes agregar la redirección a Stripe Checkout
    }

    function ingresarAlSistema() {
      alert("Redirigiendo a la aplicación principal...");
      // Redirección a la app principal
    }
  </script>

</body>
</html>
